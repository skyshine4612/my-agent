[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.0.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tiktoken>=0.7.0",
    "asyncpg>=0.30.0",
    "pyjwt>=2.9.0",
    "playwright>=1.40.0",
    "langgraph>=1.2.11",
    "langchain>=1.4.0",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.2",
]
[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
