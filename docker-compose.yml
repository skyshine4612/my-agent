services:
  # 后端服务：FastAPI 应用，仅内网 expose 8000，由 frontend 反代访问
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # 仅注入部署相关配置；LLM/MCP 等密钥类参数由挂载的 backend/.env 提供，
      # config.py 通过 env_file=".env" 在容器内 /app 直接读取
      DB_PATH: /app/data/app.db
    volumes:
      - ./data:/app/data          # SQLite 持久化
      - ./backend/.env:/app/.env:ro  # 配置挂载：Python 直接读 .env，无需在 compose 罗列密钥
    expose:
      - "8000"

  # 前端服务：nginx 托管静态资源并反代 /api（含 SSE），对外唯一入口 80
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"                    # 对外唯一入口
    depends_on:
      - backend
