services:
  # 后端服务：FastAPI 应用，仅内网 expose 8000，由 frontend 反代访问
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      # 配置挂载：Python 直接读 .env，无需在 compose 罗列密钥。
      # 数据已全部落在 Supabase Postgres，容器内不再需要持久化卷。
      - ./backend/.env:/app/.env:ro
    expose:
      - "8000"

  # 前端服务：nginx 托管静态资源并反代 /api（含 SSE），对外唯一入口 80
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"                    # 对外唯一入口
    depends_on:
      - backend
