services:
  # 后端服务：FastAPI 应用，仅内网 expose 8000，由 frontend 反代访问
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      MODELSCOPE_TOKEN: ${MODELSCOPE_TOKEN}
      AMAP_MCP_URL: ${AMAP_MCP_URL}
      DB_PATH: /app/data/app.db
    volumes:
      - ./data:/app/data          # SQLite 持久化
    expose:
      - "8000"

  # 前端服务：nginx 托管静态资源并反代 /api（含 SSE），对外唯一入口 80
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"                    # 对外唯一入口
    depends_on:
      - backend
