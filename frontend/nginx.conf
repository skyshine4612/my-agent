server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：找不到文件回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代 API；SSE 流式需关闭缓冲 + 长超时
    location /api/ {
        client_max_body_size 25m;                     # 后端单文件上限 20MB，留出 multipart 包装的余量
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;  # 透传登录凭证
        proxy_buffering off;                          # SSE 必须关缓冲
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
